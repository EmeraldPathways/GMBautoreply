<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Desk</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#182b3c;background:#eff3f7;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #b9cad8;border-radius:9px;background:white;color:#153a52;padding:10px 15px;font-weight:600}button:hover:not(:disabled){border-color:#157f9a;background:#edf8fa}button:disabled{opacity:.45;cursor:default}.primary{background:#087d98;color:white;border-color:#087d98}.primary:hover:not(:disabled){background:#086b83;color:white}.danger{color:#9d3434}.shell{max-width:1480px;margin:auto;padding:0 28px 60px}.top{background:#122c3d;color:white}.top-inner{max-width:1480px;margin:auto;padding:23px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:1.55rem;margin:0;letter-spacing:-.03em}.top p{margin:3px 0 0;color:#c5d5df;font-size:.88rem}.pill{display:inline-block;border-radius:99px;background:#e8f4f7;color:#17677a;padding:4px 10px;font-size:.82rem;font-weight:650}.top .pill{background:#244c5f;color:#d7f7fb}nav{display:flex;gap:4px;overflow:auto;border-bottom:1px solid #ccd7e2;margin-bottom:24px;padding-top:9px}nav button{border:0;border-radius:0;background:transparent;padding:16px 14px;white-space:nowrap;color:#526577}nav button.active{color:#0a6176;border-bottom:3px solid #0a829e}h2{font-size:1.3rem;letter-spacing:-.025em;margin:0 0 14px}h3{font-size:1.05rem;margin:0 0 8px}.muted{color:#607286}.small{font-size:.86rem}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.panel,.review,.metric{background:white;border:1px solid #d8e1ea;border-radius:14px;box-shadow:0 2px 10px #163a5110}.panel{padding:24px;margin-bottom:18px}.review{padding:22px;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{padding:16px}.metric strong{display:block;font-size:1.7rem;line-height:1.25;margin-top:5px}.toolbar,.actions,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{margin-bottom:14px}.toolbar h2{margin:0 auto 0 0}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:16px}input,select,textarea{border:1px solid #b8c8d7;border-radius:9px;background:#fff;color:#182b3c;padding:10px 12px;width:100%;min-height:45px}textarea{min-height:130px;resize:vertical;line-height:1.55}label{display:block;font-weight:600;margin:17px 0 7px}.check{display:flex;align-items:flex-start;gap:10px;font-weight:500}.check input{width:18px;min-height:18px;margin:3px 0 0;flex:none}.review-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.review-head strong{font-size:1.05rem}.stars{font-size:1.2rem;color:#b37506;letter-spacing:2px;margin:8px 0}.review-text{white-space:pre-wrap;line-height:1.55;margin:10px 0 4px}.flag{background:#fff2e5;border:1px solid #f0c496;border-radius:9px;padding:10px 12px;color:#7c430c;margin-top:12px}.badge{border-radius:6px;padding:3px 8px;font-size:.78rem;font-weight:700;background:#edf2f7;color:#395368}.badge.published,.badge.sample-replied{background:#e2f4e9;color:#236647}.badge.approved{background:#dcf3ef;color:#14665b}.badge.draft{background:#eaf0fc;color:#33538d}.divider{border:0;border-top:1px solid #e2e9ef;margin:18px 0}.hint{font-size:.88rem;color:#526a7b}.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.days{display:flex;gap:8px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:6px;margin:7px 6px 7px 0}.days input{width:18px;min-height:18px}.notice{position:sticky;top:10px;z-index:20;background:#e9f9f6;border:1px solid #86cabe;color:#164e4b;border-radius:10px;padding:12px 16px;margin:12px 0;display:none;box-shadow:0 5px 18px #18334222}.notice.error{background:#fff1e9;border-color:#efa980;color:#803b1a}.empty{text-align:center;padding:45px 22px}.theme-row{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center;margin:12px 0}.bar{height:10px;background:#e2ecf1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#0b899e}.example{border-top:1px solid #e1e7ee;padding:14px 0}.example p{margin:6px 0;white-space:pre-wrap}.activity{border-bottom:1px solid #e2e9ef;padding:11px 0;display:flex;justify-content:space-between;gap:15px}a{color:#087d98}@media(max-width:850px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:0 15px 35px}.top-inner{padding:18px 15px}.top p{display:none}.panel,.review{padding:17px}.filters,.field-grid{grid-template-columns:1fr}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:1.3rem}.toolbar h2{width:100%}.actions button{flex:1}.theme-row{grid-template-columns:95px 1fr 24px}}
</style></head><body><header class="top"><div class="top-inner"><div><h1>Review Desk</h1><p>Google reviews, written in your voice</p></div><span id="connectionPill" class="pill">Local workspace</span></div></header><main class="shell"><div id="message" class="notice" role="status" aria-live="polite"></div><nav id="nav" aria-label="Main navigation"></nav><div id="content"></div></main>
<script>
let state,view='Inbox',filter='unanswered',locationFilter='all',ratingFilter='all',query='',busy=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?new Date(x).toLocaleString():'—';
function notice(message,error=false){let e=document.getElementById('message');e.textContent=message;e.className='notice'+(error?' error':'');e.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
async function load(){let res=await fetch('/api/state');let data=await res.json();if(!res.ok)throw Error(data.error||'Could not load workspace');state=data;render()}
async function api(name,data={}){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let res=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let value=await res.json();if(!res.ok)throw Error(value.error||'Action failed');await load();notice(({draft:'AI draft created. Check it before approving.',approve:'Reply approved. You can publish it now.',publish:'Reply published to Google.',simulate:'Sample reply completed. No Google reply was sent.',sync:'Google reviews synced.',discover:'Locations loaded.'})[name]||'Saved.')}catch(e){notice(e.message,true);document.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{busy=false}}
function button(name,text,extra=''){return `<button data-action="${name}" ${extra}>${text}</button>`}
function render(){if(!state)return;document.getElementById('connectionPill').textContent=state.google?'Google connected':'Private local workspace';document.getElementById('nav').innerHTML=['Inbox','Insights','Your style','Business knowledge','Automation','Connections','Activity'].map(v=>`<button class="${view===v?'active':''}" data-view="${v}">${v}</button>`).join('');const s=state.settings;let h='';
if(view==='Inbox'){
 let a=state.analytics,rs=state.reviews;h=`<div class="metrics">${[['Recent Google reviews',a.total],['Average rating',a.average??'—'],['Needs a reply',a.unanswered],['Replied',a.responded]].map(([k,v])=>`<div class="metric"><span class="muted small">${k}</span><strong>${v}</strong></div>`).join('')}</div><div class="toolbar"><h2>Review inbox</h2>${button('sample','Load sample reviews')}${button('sync','Sync Google','class="primary"')}</div><p class="hint">Google reviews shown here are from the last 30 days. Samples are kept separate and never sent to Google. ${s.synced_at?'Last sync: '+date(s.synced_at*1000):'Connect Google to load live reviews.'}</p><div class="filters"><input id="search" placeholder="Search reviews" aria-label="Search reviews" value="${esc(query)}"><select id="filter" aria-label="Filter by status"><option value="unanswered">Needs a reply</option>${['all','new','draft','approved','published','sample-replied'].map(x=>`<option value="${x}" ${filter===x?'selected':''}>${x==='all'?'All reviews':x}</option>`).join('')}</select><select id="locFilter" aria-label="Filter by location"><option value="all">All locations</option><option value="sample" ${locationFilter==='sample'?'selected':''}>Samples</option>${state.locations.map(l=>`<option value="${esc(l.name)}" ${locationFilter===l.name?'selected':''}>${esc(l.title)}</option>`).join('')}</select><select id="ratingFilter" aria-label="Filter by rating"><option value="all">All ratings</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${ratingFilter==n?'selected':''}>${n} stars</option>`).join('')}</select></div>`;
 let shown=rs.filter(r=>(filter==='all'||(filter==='unanswered'?r.status!=='published'&&r.status!=='sample-replied':r.status===filter))&&(locationFilter==='all'||(locationFilter==='sample'?r.demo:r.location===locationFilter))&&(ratingFilter==='all'||r.rating==ratingFilter)&&(!query||`${r.name} ${r.text} ${r.draft}`.toLowerCase().includes(query.toLowerCase())));
 h+=shown.length?shown.map((r,i)=>`<article class="review"><div class="review-head"><strong>${esc(r.name)}</strong><span class="badge ${esc(r.status)}">${esc(r.status.replace('-',' '))}</span>${r.demo?'<span class="badge">Sample</span>':''}<span class="muted small">${esc(state.locations.find(l=>l.name===r.location)?.title||'')}</span></div><div class="stars" aria-label="${r.rating} out of 5 stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p class="review-text">${esc(r.text)||'<em>Rating only; no written comment.</em>'}</p><span class="muted small">${date(r.created)}</span>${r.flag?`<div class="flag">Requires review: ${esc(r.flag)}</div>`:r.rating<4?'<div class="flag">Low rating: handle personally before approving.</div>':''}<hr class="divider"><label for="draft-${i}">Your reply</label><textarea id="draft-${i}" ${['published','sample-replied'].includes(r.status)?'readonly':''}>${esc(r.draft)}</textarea><div class="actions">${['published','sample-replied'].includes(r.status)?`<span class="hint">${r.demo?'Sample completed':'Published on Google'}</span>`:`${button('draft','Generate AI draft',`data-review="${esc(r.id)}" data-field="draft-${i}"`)}${button('save','Save draft',`data-review="${esc(r.id)}" data-field="draft-${i}"`)}${button('approve','Approve',`data-review="${esc(r.id)}" data-field="draft-${i}" class="primary"`)}${button(r.demo?'simulate':'publish',r.demo?'Complete sample':'Publish to Google',`data-review="${esc(r.id)}" data-field="draft-${i}" ${r.status!=='approved'?'disabled':''}`)}`}</div></article>`).join(''):'<div class="panel empty"><h2>No matching reviews</h2><p class="muted">Change your filters, load sample reviews, or connect Google and sync.</p></div>';
}
if(view==='Insights'){let a=state.analytics,max=Math.max(1,...a.themes.map(x=>x[1]));h=`<div class="metrics">${[['Reviews',a.total],['Positive (4–5★)',a.positive],['Negative (1–2★)',a.negative],['Average response time',a.average_hours===null?'—':a.average_hours+'h']].map(([x,y])=>`<div class="metric"><span class="muted small">${x}</span><strong>${y}</strong></div>`).join('')}</div><div class="layout"><section class="panel"><h2>Review themes</h2>${a.themes.length?a.themes.map(([name,count])=>`<div class="theme-row"><span>${esc(name)}</span><div class="bar"><i style="width:${Math.round(count/max*100)}%"></i></div><strong>${count}</strong></div>`).join(''):'<p class="muted">Sync reviews to see themes.</p>'}</section><section class="panel"><h2>Compliments and complaints</h2><p><strong>Positive themes:</strong> ${a.compliments.map(([n,c])=>`${esc(n)} (${c})`).join(", ")||"—"}</p><p><strong>Concerns:</strong> ${a.complaints.map(([n,c])=>`${esc(n)} (${c})`).join(", ")||"—"}</p><p><strong>Staff mentions:</strong> ${a.staff.map(([n,c])=>`${esc(n)} (${c})`).join(", ")||"—"}</p><hr class="divider"><h3>What these figures cover</h3><p>Recent Google reviews in your selected locations. Samples are excluded. Response time is calculated only when Google provides both a review date and a reply date.</p><p class="muted">Themes are simple indicators for spotting patterns. Read the individual reviews before acting on them.</p></section></div>`}
if(view==='Your style')h=`<div class="layout"><section class="panel"><h2>Your response style</h2><label for="business">Business name</label><input id="business" value="${esc(s.business)}"><label for="style">Tone and writing rules</label><textarea id="style">${esc(s.style)}</textarea><div class="field-grid"><div><label for="length">Typical length</label><input id="length" value="${esc(s.length)}"></div><div><label for="signoff">Sign-off</label><input id="signoff" value="${esc(s.signoff)}"></div><div><label for="words_use">Words to use</label><input id="words_use" value="${esc(s.words_use)}"></div><div><label for="words_avoid">Words to avoid</label><input id="words_avoid" value="${esc(s.words_avoid)}"></div></div><label for="staff_names">Known staff names (comma separated)</label><input id="staff_names" value="${esc(s.staff_names)}"><label for="emoji">Emoji policy</label><select id="emoji">${['none','sparingly','allowed'].map(x=>`<option ${s.emoji===x?'selected':''}>${x}</option>`).join('')}</select><div class="actions">${button('saveStyle','Save style','class="primary"')}</div></section><section class="panel"><h2>Response examples</h2><p class="hint">Approved wording is saved here. Add your own previous replies to teach the agent your voice.</p><label for="exReview">Example review (optional)</label><textarea id="exReview" placeholder="Paste a review you have permission to use"></textarea><label for="exReply">Your reply</label><textarea id="exReply" placeholder="Paste how you responded"></textarea>${button('example-add','Add example','class="primary"')}<hr class="divider">${state.examples.length?state.examples.map(x=>`<div class="example"><p class="muted small">${esc(x.original||'Saved owner reply')}</p><p>${esc(x.reply)}</p>${button('example-delete','Remove',`data-example="${x.id}"`)}</div>`).join(''):'<p class="muted">No examples saved yet.</p>'}</section></div>`;
if(view==='Business knowledge')h=`<section class="panel"><h2>Business knowledge</h2><p>Include only confirmed services, policies, staff names, location details and contact information that a reply may mention.</p><label for="knowledge">Verified business information</label><textarea id="knowledge" style="min-height:310px">${esc(s.knowledge)}</textarea><div class="actions">${button('saveKnowledge','Save information','class="primary"')}</div></section>`;
if(view==='Automation')h=`<div class="layout"><section class="panel"><h2>Automation</h2><p>New positive reviews can be drafted or published after a delay. Older unanswered reviews stay in the manual inbox.</p><label for="auto_mode">Mode</label><select id="auto_mode">${[['off','Off'],['draft','Prepare drafts for approval'],['publish','Publish eligible replies automatically']].map(([v,t])=>`<option value="${v}" ${s.auto_mode===v?'selected':''}>${t}</option>`).join('')}</select><div class="field-grid"><div><label for="threshold">Minimum rating</label><select id="threshold"><option value="4" ${s.threshold===4?'selected':''}>4 stars</option><option value="5" ${s.threshold===5?'selected':''}>5 stars</option></select></div><div><label for="delay_minutes">Wait before drafting (minutes)</label><input type="number" min="0" max="10080" id="delay_minutes" value="${s.delay_minutes}"></div><div><label for="limit">Maximum automatic replies per day</label><input type="number" min="1" max="100" id="limit" value="${s.limit}"></div><div><label for="timezone">Timezone</label><input id="timezone" value="${esc(s.timezone)}"></div><div><label for="start">Start time</label><input id="start" type="time" value="${s.start}"></div><div><label for="end">End time</label><input id="end" type="time" value="${s.end}"></div></div><p class="hint">Publishing hours apply to automatic replies. Manual publishing remains available at any time.</p><div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<label><input type="checkbox" data-day="${i+1}" ${s.weekdays.includes(i+1)?'checked':''}>${d}</label>`).join('')}</div><label class="check"><input type="checkbox" id="consent" ${s.publish_consent?'checked':''}>I authorise this app to publish eligible replies to my selected Google Business Profile locations under these rules.</label><div class="actions">${button('saveAutomation','Save automation','class="primary"')}</div></section><section class="panel"><h2>Manual review rules</h2><p>Reviews below your rating threshold, complaints, mixed feedback and AI-flagged wording are held for your approval. The app checks Google again immediately before it publishes.</p><p class="hint">Automation runs every five minutes while this local server is open. The daily limit uses ${esc(s.timezone)}. ${s.synced_at?'Last sync: '+date(s.synced_at*1000):'A successful Google sync is required to enable it.'}</p></section></div>`;
if(view==='Connections')h=`<div class="layout"><section class="panel"><h2>Connections</h2><p>Google Business Profile: <strong>${state.google?'Connected':'Not connected'}</strong><br>OpenAI drafting: <strong>${state.ai?'Configured':'Add API key on server'}</strong></p><div class="actions">${button('connect','Sign in with Google',`class="primary" ${state.oauth_ready?'':'disabled'}`)}${button('discover','Find locations',state.google?'':'disabled')}${button('sync','Sync reviews',state.google?'':'disabled')}${button('disconnect','Disconnect Google',`class="danger" ${state.google?'':'disabled'}`)}</div><hr class="divider"><h3>Locations</h3>${state.locations.length?state.locations.map(l=>`<label class="check"><input type="checkbox" data-location="${esc(l.name)}" ${l.enabled?'checked':''}>${esc(l.title)} <span class="muted small">${esc(l.account)}</span></label>`).join(''):'<p class="muted">Sign in, then find your locations.</p>'}</section><section class="panel"><h2>Set up access</h2><ol><li>Request Google Business Profile API access for your Google Cloud project.</li><li>Create a Web OAuth client with redirect URI <code>${esc(location.origin+'/oauth/callback')}</code>.</li><li>Set <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code> in the server environment and restart it.</li><li>Sign in here, find your locations and sync.</li><li>Set <code>OPENAI_API_KEY</code> on the server to enable AI drafts.</li></ol><p class="hint">Keys and Google tokens are never shown in this page. See the README for Windows commands and the Google setup links.</p><a href="https://developers.google.com/my-business/content/prereqs" target="_blank" rel="noopener noreferrer">Google API requirements</a></section></div>`;
if(view==='Activity')h=`<section class="panel"><h2>Recent activity</h2>${state.audit.length?state.audit.map(x=>`<div class="activity"><div><strong>${esc(x.action)}</strong>${x.detail?`<div class="muted small">${esc(x.detail)}</div>`:''}</div><span class="muted small">${date(x.ts*1000)}</span></div>`).join(''):'<p class="muted">No activity yet.</p>'}</section>`;
document.getElementById('content').innerHTML=h;bind();}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>{if(b.disabled)return;b.onclick=async()=>{let d=b.dataset,a=d.action;if(a==='connect'){try{let r=await fetch('/api/oauth/start'),j=await r.json();if(!r.ok)throw Error(j.error);location.href=j.url}catch(e){notice(e.message,true)}return}if(a==='saveStyle'){api('settings',Object.fromEntries(['business','style','length','signoff','words_use','words_avoid','staff_names','emoji'].map(k=>[k,document.getElementById(k).value])));return}if(a==='saveKnowledge'){api('settings',{knowledge:document.getElementById('knowledge').value});return}if(a==='saveAutomation'){api('settings',{auto_mode:document.getElementById('auto_mode').value,threshold:Number(document.getElementById('threshold').value),delay_minutes:Number(document.getElementById('delay_minutes').value),limit:Number(document.getElementById('limit').value),timezone:document.getElementById('timezone').value,start:document.getElementById('start').value,end:document.getElementById('end').value,weekdays:[...document.querySelectorAll('[data-day]:checked')].map(x=>Number(x.dataset.day)),confirm_auto_publish:document.getElementById('consent').checked});return}if(a==='example-add'){api(a,{original:document.getElementById('exReview').value,reply:document.getElementById('exReply').value});return}if(a==='example-delete'){api(a,{example_id:Number(d.example)});return}if(a==='disconnect'&&!confirm('Revoke this app’s Google access and stop automation? Google may also invalidate other tokens issued to this Cloud project.'))return;api(a,{id:d.review,draft:d.field?document.getElementById(d.field).value:undefined});}});document.querySelectorAll('[data-location]').forEach(e=>e.onchange=()=>api('location',{name:e.dataset.location,enabled:e.checked}));for(let [id,set] of [['filter',v=>filter=v],['locFilter',v=>locationFilter=v],['ratingFilter',v=>ratingFilter=v]]){let e=document.getElementById(id);if(e)e.onchange=()=>{set(e.value);render()}}let search=document.getElementById('search');if(search)search.oninput=()=>{query=search.value;let pos=search.selectionStart;render();let next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)}}
load().then(()=>{if(new URLSearchParams(location.search).has('connected')){view='Connections';render();notice('Google authorised. Select your locations and sync.');history.replaceState(null,'','/')}}).catch(e=>notice(e.message,true));
</script></body></html>
